<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VitaRoute | Loading</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="loading-screen">
    <div class="loading-overlay"></div>
    <div class="loading-content">
      <div class="brand" style="justify-content:center; color:#fff;">
        <div class="brand-mark"></div>
        <div>
          <h3>VitaRoute</h3>
        </div>
      </div>
      <h1 style="font-size:2.4rem; margin:18px 0 8px;">Connecting Care in Motion</h1>
      <p style="color:var(--muted); margin-bottom:18px;">Preparing Your Workspace.</p>
      <div class="loading-bar"><span id="loadingBar"></span></div>
      <div style="margin-top:12px; font-weight:700; letter-spacing:0.08em;" id="loadingPercent">0%</div>
    </div>
  </div>
  <script src="/js/app.js"></script>
</body>
</html>
