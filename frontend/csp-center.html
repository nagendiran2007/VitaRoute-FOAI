<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>VitaRoute | CSP Center</title><link rel="stylesheet" href="/css/styles.css" /></head>
<body>
  <div class="app-shell"><aside class="sidebar"><div class="brand"><div class="brand-mark"></div><div><h3>VitaRoute</h3></div></div><p class="sidebar-label">Simulation Console</p><nav><a class="nav-item" href="/admin-dashboard">Overview</a><a class="nav-item" href="/hospitals">Hospitals</a><a class="nav-item" href="/patients">Patients</a><a class="nav-item" href="/organs">Organs</a><a class="nav-item" href="/matching">Run Matching</a><a class="nav-item" href="/matches">Matches</a><a class="nav-item" href="/transit">Transit</a><a class="nav-item active" href="/csp-center">CSP Center</a></nav><div class="signoff"><button id="logoutButton" class="btn btn-secondary" style="width:100%;">Sign Out</button></div></aside>
    <main class="content"><div class="topbar"><div><div class="breadcrumb">VitaRoute / CSP Center</div><h1 class="page-title">CSP Center</h1></div></div><section class="card"><div class="dashboard-grid" id="cspStats"><div class="card stat-card"><div class="label">Total Variables</div><div class="value" data-stat="variables">0</div></div><div class="card stat-card"><div class="label">Initial Domain Size</div><div class="value" data-stat="initial_domain_size">0</div></div><div class="card stat-card"><div class="label">AC-3 Removed Values</div><div class="value" data-stat="ac3_removed_values">0</div></div><div class="card stat-card"><div class="label">Remaining Candidates</div><div class="value" data-stat="remaining_candidates">0</div></div><div class="card stat-card"><div class="label">Backtracking Steps</div><div class="value" data-stat="backtracking_steps">0</div></div><div class="card stat-card"><div class="label">Valid Assignments</div><div class="value" data-stat="valid_assignments">0</div></div></div></section></main>
  </div>
  <script src="/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await bootstrapSession();
      const data = await fetch('/api/csp').then(r => r.json());
      const stats = document.querySelectorAll('[data-stat]');
      stats.forEach(el => {
        const key = el.dataset.stat.replace(/-/g, '_');
        if (data[key] !== undefined) el.textContent = data[key];
      });
    });
  </script>
</body>
</html>
