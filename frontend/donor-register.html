<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VitaRoute | Donor Registration</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body style="padding:24px;">
  <div class="form-card">
    <div class="brand">
      <div class="brand-mark"></div>
      <div>
        <div style="font-size:0.72rem; letter-spacing:0.14em; text-transform:uppercase; color:var(--muted);">VitaRoute</div>
        <div style="font-size:0.82rem; color:var(--muted);">Donor Registration</div>
      </div>
    </div>
    <h2 style="margin-top:18px;">Register Donor</h2>
    <p class="small-muted">After saving donor details, add the donated organ from the donor list.</p>
    <div id="messageBox" style="display:none; margin:12px 0; font-weight:600;"></div>
    <form id="donorForm">
      <div class="form-grid">
        <label><span>Full Name</span><input name="donor_name" required /></label>
        <label><span>Age</span><input name="age" type="number" required /></label>
        <label><span>Gender</span><select name="gender"><option>Male</option><option>Female</option><option>Other</option></select></label>
        <label><span>Blood Group</span><select name="blood_group"><option>O-</option><option>O+</option><option>A-</option><option>A+</option><option>B-</option><option>B+</option><option>AB-</option><option>AB+</option></select></label>
        <label><span>Contact Number</span><input name="contact_number" required /></label>
        <label><span>Organ Type</span><select name="organ_type"><option>Kidney</option><option>Liver</option><option>Heart</option><option>Lungs</option><option>Pancreas</option><option>Intestine</option><option>Cornea</option></select></label>
        <label style="grid-column:1 / -1;"><span>Address</span><input name="address" required /></label>
        <label><span>Consent Status</span><select name="consent_status"><option>Confirmed</option><option>Pending</option><option>Rejected</option></select></label>
      </div>
      <div style="margin-top:18px; display:flex; gap:12px; flex-wrap:wrap;">
        <button class="btn btn-primary" type="submit">Submit Donor</button>
        <a class="btn btn-secondary" href="/donors">Donor list</a>
      </div>
    </form>
  </div>
  <script src="/js/app.js"></script>
  <script>
    document.getElementById('donorForm').addEventListener('submit', async function (event) {
      event.preventDefault();
      const payload = Object.fromEntries(new FormData(this).entries());
      const result = await fetch('/api/register-donor', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      }).then(r => r.json());
      const box = document.getElementById('messageBox');
      box.style.display = 'block';
      box.textContent = result.message || 'Saved';
      box.style.color = result.success ? '#1e8f6c' : '#d68a7d';
      if (result.success) {
        this.reset();
        window.setTimeout(() => { window.location.href = '/organ-register'; }, 800);
      }
    });
  </script>
</body>
</html>
